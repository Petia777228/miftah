# Юнит 4: ج ح خ ع, имя, род (та марбута ة), именное предложение هٰذَا بَيْتٌ, вопрос هَلْ / مَا.
# Малый алиф в هٰذَا и هٰذِهِ разрешён с этого юнита (course.yaml, marks).
unit: 4
words:
  - { id: jamal,     ar: جَمَل,     tr: джамал,     ru: верблюд,              root: ج م ل, pos: noun, gender: m }
  - { id: jabal,     ar: جَبَل,     tr: джабал,     ru: гора,                 root: ج ب ل, pos: noun, gender: m }
  - { id: bahr,      ar: بَحْر,     tr: бах̣р,      ru: море,                 root: ب ح ر, pos: noun, gender: m }
  - { id: halib,     ar: حَلِيب,    tr: х̣алӣб,     ru: молоко,               root: ح ل ب, pos: noun, gender: m }
  - { id: rajul,     ar: رَجُل,     tr: раджул,     ru: мужчина,              root: ر ج ل, pos: noun, gender: m }
  - { id: jadid,     ar: جَدِيد,    tr: джадӣд,     ru: новый,                root: ج د د, pos: adj }
  - { id: hubb,      ar: حُبّ,      tr: х̣убб,      ru: любовь,               root: ح ب ب, pos: noun, gender: m }
  - { id: khubz,     ar: خُبْز,     tr: хубз,       ru: хлеб,                 root: خ ب ز, pos: noun, gender: m }
  - { id: ayn,       ar: عَيْن,     tr: ʻайн,       ru: "глаз; источник",      root: ع ي ن, pos: noun, gender: f }
  - { id: ilm,       ar: عِلْم,     tr: ʻилм,       ru: "знание, наука",       root: ع ل م, pos: noun, gender: m }
  - { id: akh,       ar: أَخ,       tr: ах,         ru: брат,                 root: أ خ و, pos: noun, gender: m }
  - { id: tarikh,    ar: تَارِيخ,   tr: та̄рӣх,      ru: история,              root: أ ر خ, pos: noun, gender: m }
  - { id: amal,      ar: عَمَل,     tr: ʻамал,      ru: "работа, дело",        root: ع م ل, pos: noun, gender: m }
  - { id: madina,    ar: مَدِينَة,  tr: мадӣна,     ru: город,                root: م د ن, pos: noun, gender: f }
  - { id: jamia,     ar: جَامِعَة,  tr: джа̄миʻа,    ru: университет,          root: ج م ع, pos: noun, gender: f }
  - { id: jadd,      ar: جَدّ,      tr: джадд,      ru: дед,                  root: ج د د, pos: noun, gender: m }
  - { id: jadda,     ar: جَدَّة,    tr: джадда,     ru: бабушка,              root: ج د د, pos: noun, gender: f }
  - { id: muallim,   ar: مُعَلِّم,  tr: муʻаллим,   ru: учитель,              root: ع ل م, pos: noun, gender: m }
  - { id: muallima,  ar: مُعَلِّمَة, tr: муʻаллима, ru: учительница,          root: ع ل م, pos: noun, gender: f }
