# Вводный юнит. Букв ещё нет: в упражнениях допустимы только огласовки на пунктирном кружке ◌.
# Примеры с буквами в теории помечены showcase: true (показать, не читать).
unit: 0
words: []
lessons:
  - id: u0-l1
    kind: grammar
    title: Звуки, которых нет в русском
    steps:
      - type: theory
        text: |
          В арабском 28 согласных. Половина звучит почти как русские: б, т, д, р, з, с, ш, ф, к, л, м, н.
          Остальные придётся ставить заново. Их три группы: **межзубные**, **эмфатические** и **гортанные**.

          В транскрипции такие звуки помечены точкой или чертой под буквой: **з̱**, **с̣**, **х̣**.
          Метка значит «похоже на русский звук, но это другой звук».
      - type: theory
        showcase: true
        text: |
          **Межзубные.** Кончик языка между зубами, как в английском *think* и *this*.
        examples:
          - { ar: ث, tr: с̱, ru: "как th в think" }
          - { ar: ذ, tr: з̱, ru: "как th в this" }
      - type: choice
        prompt: Как произносится з̱?
        correct: кончик языка между зубами
        wrong: [как русское з, в глубине горла, с округлёнными губами]
      - type: theory
        showcase: true
        text: |
          **Эмфатические.** Корень языка поднят к нёбу, звук получается «толстым».
          Гласные рядом с ним темнеют: а звучит ближе к о.
        examples:
          - { ar: ص, tr: с̣, ru: "толстое с" }
          - { ar: ط, tr: т̣, ru: "толстое т" }
      - type: choice
        prompt: Что значит точка под буквой в с̣ и т̣?
        correct: эмфатический, «толстый» звук
        wrong: [долгий звук, звук не произносится, удвоенный звук]
      - type: theory
        showcase: true
        text: |
          **Гортанные.** Звучат в горле, в русском их нет совсем.
        examples:
          - { ar: ح, tr: х̣, ru: "сиплый выдох, будто дышишь на очки" }
          - { ar: ع, tr: ʻ, ru: "звонкое сжатие горла" }
          - { ar: ء, tr: ʼ, ru: "смычка, как пауза в «не-а»" }
      - type: choice
        prompt: На что похож звук х̣?
        correct: сиплый выдох, как на запотевшее стекло
        wrong: [русское х в слове «хор», звонкое г, русское к]
      - type: choice
        prompt: "Что такое ʼ (хамза)?"
        correct: короткая смычка горла
        wrong: [долгое а, мягкий знак, звук й]

  - id: u0-l2
    kind: grammar
    title: Справа налево
    steps:
      - type: theory
        showcase: true
        text: |
          Арабский пишут **справа налево**. Книга открывается там, где у русской последняя страница.

          Заглавных букв нет. Буквы внутри слова соединяются, поэтому у большинства их **четыре формы**: отдельная, в начале, в середине и в конце слова.
        examples:
          - { ar: كِتَابٌ, tr: кита̄бун, ru: "книга: читаем от правого края" }
      - type: choice
        prompt: В какую сторону пишут по-арабски?
        correct: справа налево
        wrong: [слева направо, сверху вниз, как удобно пишущему]
      - type: choice
        prompt: Сколько форм у большинства букв?
        correct: четыре
        wrong: [одна, две, шесть]
      - type: theory
        text: |
          Буквами пишут **согласные и долгие гласные**. Краткие а, и, у показывают значками над и под буквой. Это **огласовки**.

          В учебниках, детских книгах и Коране огласовки ставят. В газетах и на вывесках их нет, и читатель восстанавливает гласные по смыслу. Мы начинаем с огласованного текста.
      - type: choice
        prompt: Что пишут буквами?
        correct: согласные и долгие гласные
        wrong: [все звуки, только гласные, только краткие гласные]
      - type: choice
        prompt: Есть ли в арабском заглавные буквы?
        correct: нет
        wrong: ["да, в начале предложения", только в именах, только в заголовках]

  - id: u0-l3
    kind: grammar
    title: Огласовки и сукун
    steps:
      - type: theory
        text: |
          Три краткие гласные и знак «без гласного». Пунктирный кружок ◌ здесь стоит вместо любой буквы.
        examples:
          - { ar: ◌َ, tr: а, ru: "фатха: черта над буквой" }
          - { ar: ◌ِ, tr: и, ru: "касра: черта под буквой" }
          - { ar: ◌ُ, tr: у, ru: "дамма: завиток над буквой" }
          - { ar: ◌ْ, tr: "нет", ru: "сукун: кружок, гласного нет" }
      - type: read
        show: ◌َ
        correct: а
        wrong: [и, у, гласного нет]
      - type: read
        show: ◌ِ
        correct: и
        wrong: [а, у, гласного нет]
      - type: read
        show: ◌ُ
        correct: у
        wrong: [а, и, гласного нет]
      - type: read
        show: ◌ْ
        correct: гласного нет
        wrong: [а, и, у]
      - type: choice
        prompt: Какой значок читается как «и»?
        correct: ◌ِ
        wrong: [◌َ, ◌ُ, ◌ْ]
      - type: input
        show: ◌ُ
        prompt: Напиши гласный русской буквой
        answer: у
