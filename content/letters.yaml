# 28 букв + хамза. unit — юнит, где буква вводится (по таблице docs/01-kuzmin-method.md).
# joining: dual — соединяется с обеих сторон (4 формы), right — только с предыдущей (2 формы).
# tr — русская научная транскрипция (точка/черта под буквой = «похожий, но другой звук»).
- { char: ا, name: алиф,  tr: а̄,  joining: right, unit: 1, sound: "своего звука нет; после фатхи тянет а в долгое а̄" }
